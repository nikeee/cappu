# Lint for the JavaScript that is left outside the Go build: the VS Code
# extension and the release scripts. The suite itself lives in CI (Go).

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - run: npm ci --no-audit

      - run: node --run ci
