# CI for the Go build (./togo), the only build. The test job runs the suite
# under a preinstalled JDK 21; the jdk job repeats it without a JDK at all
# (javac-dependent tests skip), under 25, and under a JDK that cappu
# PROVISIONED itself (#8 - then the only javac on PATH). The build job
# cross-compiles the statically linked release binaries (CGO_ENABLED=0) for
# every target.

name: CI (Go)

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: togo

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: togo/go.sum

      # javac lets the publish testcontainers e2e build a real jar (Docker is
      # available on GitHub-hosted runners); without it the e2e skips itself.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - name: Generated code is up to date
        run: |
          go install github.com/mailru/easyjson/easyjson@latest
          make generate-check

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: togo

      - run: go vet ./...
      - run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: togo/coverage.out
          flags: go
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  jdk:
    name: Test (JDK ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: ["none", "25", "provisioned"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: togo/go.sum

      - uses: actions/setup-java@v5
        if: matrix.jdk == '25'
        with:
          distribution: temurin
          java-version: "25"

      # Ubuntu's runner image ships a JDK; the "none" and "provisioned" legs
      # have to hide it to be what they say they are.
      - name: Hide the preinstalled JDK
        if: matrix.jdk != '25'
        run: echo "JAVA_HOME=" >> "$GITHUB_ENV" && sudo rm -rf /usr/lib/jvm

      - name: Provision a JDK through cappu
        if: matrix.jdk == 'provisioned'
        run: |
          make build
          mkdir /tmp/jdk-project
          echo '{"jdk": "temurin-21"}' > /tmp/jdk-project/cappu.json
          (cd /tmp/jdk-project && "$GITHUB_WORKSPACE/togo/dist/cappu" install)
          echo "/tmp/jdk-project/.cappu/jdks/temurin-21/bin" >> "$GITHUB_PATH"

      - run: go test ./...

  build:
    name: Build static binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: togo/go.sum

      - run: make build-all

      - uses: actions/upload-artifact@v7
        with:
          name: cappu-go-binaries
          path: togo/dist/*
          retention-days: 7
